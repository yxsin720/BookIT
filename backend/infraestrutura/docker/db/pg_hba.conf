# Regras de acesso do BookIT (usadas pelo primário).
# Formato: TIPO  BASE  UTILIZADOR  ENDEREÇO  MÉTODO

# Ligações por socket Unix, dentro do próprio contentor.
local   all             all                                     trust

# Ligações TCP na própria máquina do contentor.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Ligações dos outros serviços da rede Docker (api, ia, réplica).
host    all             all             all                     scram-sha-256

# Replicação: apenas o utilizador dedicado, a partir da rede Docker.
host    replication     replicador      all                     scram-sha-256
