name: bookit-db
services:
  db:
    image: postgres:16-alpine
    container_name: bookit-db
    restart: unless-stopped
    # Primário: escreve WAL suficiente para alimentar a réplica.
    command:
      - postgres
      - -c
      - hba_file=/etc/bookit/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hot_standby=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICADOR_PASSWORD: ${REPLICADOR_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - bookit-db-data:/var/lib/postgresql/data
      - ../../db/BookIT.sql:/docker-entrypoint-initdb.d/01-bookit.sql:ro
      - ./db/00-replicacao.sh:/docker-entrypoint-initdb.d/00-replicacao.sh:ro
      - ./db/pg_hba.conf:/etc/bookit/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Réplica em hot standby: copia o primário e segue o WAL em tempo real.
  # Só aceita leituras enquanto o primário estiver vivo.
  db-replica:
    image: postgres:16-alpine
    container_name: bookit-db-replica
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/bookit/replica-entrypoint.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: db
      REPLICADOR_USER: replicador
      REPLICADOR_PASSWORD: ${REPLICADOR_PASSWORD}
      PGPASSWORD: ${REPLICADOR_PASSWORD}
    volumes:
      - bookit-db-replica-data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/opt/bookit/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bookit-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ia:
    build: ../../ia
    restart: on-failure
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    container_name: bookit-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_ADDRESS}:${HTTP_PORT}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  bookit-db-data:
  bookit-db-replica-data:
  bookit-redis-data:
