<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="840" font-family="Carlito, DejaVu Sans, sans-serif"><defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11" fill="none" stroke="#2B2622" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="140.0" y="40" width="760" height="100" rx="10" fill="#F7F2E9" stroke="#2B2622" stroke-width="2.4"/><text x="520" y="84.0" text-anchor="middle" font-size="24" font-weight="bold">1. Pedido de reserva</text><text x="520" y="114.0" text-anchor="middle" font-size="19" fill="#7A6F64">n.º de pessoas, duração, equipamento, janela de datas</text><line x1="520" y1="140" x2="520" y2="200" stroke="#2B2622" stroke-width="2.2" marker-end="url(#a)"/><rect x="140.0" y="200" width="760" height="100" rx="10" fill="#fff" stroke="#2B2622" stroke-width="2.4"/><text x="520" y="244.0" text-anchor="middle" font-size="24" font-weight="bold">2. Gerar candidatos</text><text x="520" y="274.0" text-anchor="middle" font-size="19" fill="#7A6F64">pares (recurso, horário) possíveis</text><line x1="520" y1="300" x2="520" y2="360" stroke="#2B2622" stroke-width="2.2" marker-end="url(#a)"/><rect x="140.0" y="360" width="760" height="100" rx="10" fill="#fff" stroke="#2B2622" stroke-width="2.4"/><text x="520" y="404.0" text-anchor="middle" font-size="24" font-weight="bold">3. Aplicar as restrições obrigatórias</text><text x="520" y="434.0" text-anchor="middle" font-size="19" fill="#7A6F64">sem sobreposição, capacidade, equipamento, horário, permissões</text><line x1="520" y1="460" x2="520" y2="520" stroke="#2B2622" stroke-width="2.2" marker-end="url(#a)"/><rect x="140.0" y="520" width="760" height="100" rx="10" fill="#fff" stroke="#2B2622" stroke-width="2.4"/><text x="520" y="564.0" text-anchor="middle" font-size="24" font-weight="bold">4. Pesquisar as soluções</text><text x="520" y="594.0" text-anchor="middle" font-size="19" fill="#7A6F64">backtracking com forward checking, MRV, AC-3, branch and bound</text><line x1="520" y1="620" x2="520" y2="680" stroke="#2B2622" stroke-width="2.2" marker-end="url(#a)"/><rect x="140.0" y="680" width="760" height="100" rx="10" fill="#F7F2E9" stroke="#2B2622" stroke-width="2.4"/><text x="520" y="724.0" text-anchor="middle" font-size="24" font-weight="bold">5. Ordenar por custo e devolver as k melhores</text><text x="520" y="754.0" text-anchor="middle" font-size="19" fill="#7A6F64">preferências de local e hora, desperdício de capacidade</text><line x1="900.0" y1="410.0" x2="990.0" y2="410.0" stroke="#2B2622" stroke-width="2.2" stroke-dasharray="9 7"/><rect x="990.0" y="360.0" width="320" height="100" rx="10" fill="#fff" stroke="#2B2622" stroke-width="2.4" stroke-dasharray="9 7"/><text x="1150.0" y="404.0" text-anchor="middle" font-size="24" font-weight="bold">Sem candidatos?</text><text x="1150.0" y="434.0" text-anchor="middle" font-size="19" fill="#7A6F64">sugerir outra janela ou equipamento</text></svg>